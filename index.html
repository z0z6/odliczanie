<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odliczanie</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h2 class="subtitle">DO WYDARZENIA POZOSTAŁO</h2>

        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <label>DNI</label>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <label>GODZIN</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>MINUT</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>SEKUND</label>
            </div>
        </div>

        <div class="separator"></div>

        <h1 class="event-name">Moja Wielka Premiera</h1>
        <p class="event-date">12 WRZEŚNIA 2026</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
